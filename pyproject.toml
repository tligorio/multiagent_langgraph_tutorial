[project]
name = "multiagent-langgraph-tutorial"
version = "0.2.0"
description = "A LangGraph multi-agent research assistant: a lead planner, parallel research subagents, and a citation check (AI Agents, CSCI 395.32)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.4.0",
    "langchain>=1.2.3",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.8",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.0",
    "jupyter>=1.0.0",
]
